<title>生產流程管理系統</title>
<style>
  :root{
    --bg:#EEF0EE;
    --surface:#FFFFFF;
    --surface-2:#E3E7E5;
    --ink:#1B2422;
    --ink-dim:#57635F;
    --ink-faint:#8A948F;
    --border:#CBD2CE;
    --border-strong:#AAB4AE;
    --accent:#B5601C;
    --accent-ink:#FFFFFF;
    --accent-soft:#B5601C1A;
    --success:#2F7A4F;
    --success-soft:#2F7A4F1A;
    --warning:#B4790F;
    --warning-soft:#B4790F1A;
    --danger:#B23A2E;
    --danger-soft:#B23A2E1A;
    --info:#286E78;
    --info-soft:#286E781A;
    --shadow: 0 1px 2px rgba(20,24,22,.06), 0 4px 14px rgba(20,24,22,.05);
    --radius: 8px;
    --font-body: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SFMono-Regular", Consolas, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181A;
      --surface:#1B2123;
      --surface-2:#232B2C;
      --ink:#E7ECE9;
      --ink-dim:#9AA6A1;
      --ink-faint:#6C7975;
      --border:#323C3D;
      --border-strong:#46524F;
      --accent:#E29A4A;
      --accent-ink:#171B14;
      --accent-soft:#E29A4A26;
      --success:#57B279;
      --success-soft:#57B27926;
      --warning:#E0AB3E;
      --warning-soft:#E0AB3E26;
      --danger:#E37164;
      --danger-soft:#E3716426;
      --info:#5CBAC4;
      --info-soft:#5CBAC426;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A; --surface:#1B2123; --surface-2:#232B2C; --ink:#E7ECE9; --ink-dim:#9AA6A1; --ink-faint:#6C7975;
    --border:#323C3D; --border-strong:#46524F; --accent:#E29A4A; --accent-ink:#171B14; --accent-soft:#E29A4A26;
    --success:#57B279; --success-soft:#57B27926; --warning:#E0AB3E; --warning-soft:#E0AB3E26;
    --danger:#E37164; --danger-soft:#E3716426; --info:#5CBAC4; --info-soft:#5CBAC426;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#EEF0EE; --surface:#FFFFFF; --surface-2:#E3E7E5; --ink:#1B2422; --ink-dim:#57635F; --ink-faint:#8A948F;
    --border:#CBD2CE; --border-strong:#AAB4AE; --accent:#B5601C; --accent-ink:#FFFFFF; --accent-soft:#B5601C1A;
    --success:#2F7A4F; --success-soft:#2F7A4F1A; --warning:#B4790F; --warning-soft:#B4790F1A;
    --danger:#B23A2E; --danger-soft:#B23A2E1A; --info:#286E78; --info-soft:#286E781A;
    --shadow: 0 1px 2px rgba(20,24,22,.06), 0 4px 14px rgba(20,24,22,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ cursor:pointer; }
  a{ color:var(--accent); }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); }

  .shell{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px; gap:22px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:0 6px; }
  .brand-mark{
    width:34px; height:34px; border-radius:6px; background:var(--ink); color:var(--bg);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:.02em; flex:0 0 auto;
  }
  :root[data-theme="dark"] .brand-mark, @media (prefers-color-scheme:dark){ .brand-mark{ background:var(--accent); color:var(--accent-ink); } }
  .brand-text{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-text b{ font-size:14px; font-weight:800; letter-spacing:.01em; }
  .brand-text span{ font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); }

  .nav{ display:flex; flex-direction:column; gap:2px; }
  .nav-group-label{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint); padding:10px 10px 4px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; border:none; background:transparent;
    color:var(--ink-dim); text-align:left; width:100%; font-size:13px; font-weight:600;
  }
  .nav-item svg{ width:16px; height:16px; flex:0 0 auto; opacity:.85; }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); }
  .nav-item .count{ margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .nav-item.active .count{ color:var(--accent); }

  .sidebar-foot{ margin-top:auto; padding:10px; border-top:1px solid var(--border); font-size:11px; color:var(--ink-faint); }

  /* ---------- main ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:22px 30px 14px; border-bottom:1px solid var(--border); background:var(--bg);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:20px; margin:0; font-weight:800; letter-spacing:-.01em; text-wrap:balance; }
  .topbar p{ margin:2px 0 0; color:var(--ink-dim); font-size:12.5px; }
  .view{ padding:22px 30px 60px; display:flex; flex-direction:column; gap:20px; }
  .view[hidden]{ display:none; }

  /* ---------- shared bits ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad{ padding:18px 20px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); gap:10px; }
  .card-head h2{ font-size:14px; margin:0; font-weight:700; }
  .card-head .hint{ font-size:12px; color:var(--ink-faint); }
  .grid{ display:grid; gap:16px; }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .grid.cols-3{ grid-template-columns:repeat(3,1fr); }
  .grid.cols-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:1000px){ .grid.cols-2, .grid.cols-3, .grid.cols-4{ grid-template-columns:1fr; } }

  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--ink-dim); letter-spacing:.02em; }
  .field .req{ color:var(--danger); }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=password], select, textarea{
    background:var(--bg); border:1px solid var(--border-strong); border-radius:6px; padding:8px 10px; color:var(--ink);
    outline:none; width:100%;
  }
  textarea{ resize:vertical; font-family:var(--font-mono); line-height:1.6; }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .form-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .form-row > .field{ flex:1; min-width:150px; }
  .radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .radio-chip{ display:flex; align-items:center; gap:6px; border:1px solid var(--border-strong); border-radius:20px; padding:6px 12px; font-size:12.5px; font-weight:600; color:var(--ink-dim); }
  .radio-chip input{ accent-color:var(--accent); }
  .radio-chip.checked{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .btn{ display:inline-flex; align-items:center; gap:7px; border-radius:6px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); padding:8px 14px; font-size:12.5px; font-weight:700; white-space:nowrap; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  :root[data-theme="dark"] .btn.primary, @media (prefers-color-scheme: dark){ .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); } }
  .btn.accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-dim); padding:6px 8px; }
  .btn.ghost:hover{ color:var(--ink); background:var(--surface-2); }
  .btn.danger{ color:var(--danger); border-color:var(--danger-soft); }
  .btn.sm{ padding:5px 10px; font-size:11.5px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn:focus-visible, .nav-item:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .table-wrap{ overflow-x:auto; }
  .empty-row{ color:var(--ink-faint); font-style:normal; text-align:center; padding:26px 12px; }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .chip.success{ background:var(--success-soft); color:var(--success); }
  .chip.warning{ background:var(--warning-soft); color:var(--warning); }
  .chip.danger{ background:var(--danger-soft); color:var(--danger); }
  .chip.info{ background:var(--info-soft); color:var(--info); }
  .chip.neutral{ background:var(--surface-2); color:var(--ink-dim); }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto; }

  /* KPI tiles */
  .kpi{ padding:16px 18px; display:flex; flex-direction:column; gap:6px; border-left:3px solid var(--border-strong); }
  .kpi.accent{ border-left-color:var(--accent); }
  .kpi.warn{ border-left-color:var(--warning); }
  .kpi.danger{ border-left-color:var(--danger); }
  .kpi.ok{ border-left-color:var(--success); }
  .kpi .kpi-num{ font-family:var(--font-mono); font-size:26px; font-weight:700; letter-spacing:-.01em; }
  .kpi .kpi-label{ font-size:11.5px; color:var(--ink-dim); font-weight:600; }

  /* pipeline visualization */
  .traveler{ padding:14px 18px; display:flex; flex-direction:column; gap:10px; }
  .traveler-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .traveler-id{ font-family:var(--font-mono); font-weight:700; font-size:13px; }
  .traveler-meta{ font-size:12px; color:var(--ink-dim); }
  .pipeline{ display:flex; align-items:center; gap:0; overflow-x:auto; padding:4px 0; }
  .pipe-node{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:78px; flex:0 0 auto; position:relative; }
  .pipe-dot{ width:15px; height:15px; border-radius:50%; border:2px solid var(--border-strong); background:var(--surface); z-index:1; }
  .pipe-node.done .pipe-dot{ background:var(--success); border-color:var(--success); }
  .pipe-node.current .pipe-dot{ background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  .pipe-node.exception .pipe-dot{ background:var(--danger); border-color:var(--danger); box-shadow:0 0 0 4px var(--danger-soft); }
  .pipe-label{ font-size:10.5px; color:var(--ink-dim); text-align:center; white-space:nowrap; }
  .pipe-node.current .pipe-label{ color:var(--accent); font-weight:700; }
  .pipe-node.exception .pipe-label{ color:var(--danger); font-weight:700; }
  .pipe-qty{ font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint); }
  .pipe-line{ flex:1; height:2px; background:var(--border-strong); min-width:22px; margin-bottom:20px; }
  .pipe-line.done{ background:var(--success); }
  .progress-bar{ height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .progress-bar > i{ display:block; height:100%; background:var(--accent); }

  /* diagnostic list (AI check) */
  .diag-row{ display:flex; gap:10px; padding:10px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface); align-items:flex-start; }
  .diag-row + .diag-row{ margin-top:8px; }
  .diag-row.pass{ border-left:3px solid var(--success); }
  .diag-row.fail{ border-left:3px solid var(--danger); }
  .diag-row.warn{ border-left:3px solid var(--warning); }
  .diag-row.info{ border-left:3px solid var(--info); }
  .diag-icon{ flex:0 0 auto; width:18px; height:18px; margin-top:1px; }
  .diag-row.pass .diag-icon{ color:var(--success); }
  .diag-row.fail .diag-icon{ color:var(--danger); }
  .diag-row.warn .diag-icon{ color:var(--warning); }
  .diag-row.info .diag-icon{ color:var(--info); }
  .diag-title{ font-weight:700; font-size:12.8px; }
  .diag-msg{ color:var(--ink-dim); font-size:12.3px; margin-top:2px; }

  .ticket{ border:1px dashed var(--border-strong); border-radius:8px; padding:16px 18px; background:var(--surface-2); font-family:var(--font-mono); font-size:12.5px; line-height:1.9; }
  .ticket .t-row{ display:flex; justify-content:space-between; gap:14px; border-bottom:1px dotted var(--border); padding:2px 0; }
  .ticket .t-row:last-child{ border-bottom:none; }
  .ticket .t-key{ color:var(--ink-faint); }
  .ticket .t-val{ font-weight:700; }

  .stat-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .stat-bar-row .name{ width:130px; flex:0 0 auto; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-bar-track{ flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .stat-bar-fill{ height:100%; background:var(--accent); }
  .stat-bar-num{ width:60px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); }

  .divider{ height:1px; background:var(--border); border:none; margin:2px 0; }
  .muted{ color:var(--ink-faint); }
  .small{ font-size:12px; }
  .small.over{ color:var(--danger); font-weight:700; }
  .stack{ display:flex; flex-direction:column; gap:10px; }
  .inline-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag-editable{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:6px 8px 6px 12px; font-size:12.5px; }
  .tag-editable b{ font-family:var(--font-mono); }
  .order-btns{ display:flex; flex-direction:column; }
  .order-btns button{ border:none; background:none; color:var(--ink-faint); padding:0 4px; line-height:1; }
  .order-btns button:hover{ color:var(--ink); }

  /* ---- 站別積木：拖拉排流程 ---- */
  .block-palette{ display:flex; flex-wrap:wrap; gap:10px; padding:14px; background:var(--surface-2); border:1.5px dashed var(--border-strong); border-radius:10px; }
  .block-tile{
    position:relative; display:flex; align-items:center; gap:7px; padding:9px 16px 9px 12px;
    border-radius:8px 8px 8px 2px; font-size:12.5px; font-weight:700; color:#fff;
    cursor:grab; user-select:none; box-shadow:0 2px 0 rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .block-tile::after{
    content:""; position:absolute; right:-6px; top:50%; transform:translateY(-50%);
    width:12px; height:14px; background:inherit; border-radius:0 4px 4px 0;
  }
  .block-tile:hover{ transform:translateY(-1px); box-shadow:0 3px 0 rgba(0,0,0,.2), 0 3px 6px rgba(0,0,0,.3); }
  .block-tile:active{ cursor:grabbing; }
  .block-tile.dragging{ opacity:.4; }
  .block-tile .trash-btn{ background:rgba(0,0,0,.2); border:none; color:#fff; border-radius:4px; width:16px; height:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .block-tile .trash-btn:hover{ background:rgba(0,0,0,.4); }
  .block-tile .trash-btn svg{ width:10px; height:10px; }

  .block-chain{ display:flex; flex-wrap:wrap; align-items:center; gap:0; min-height:56px; padding:12px; background:var(--surface-2); border-radius:10px; border:1.5px solid var(--border); }
  .block-chain.dropzone-active{ border-color:var(--accent); background:var(--accent-soft); }
  .block-chain .chain-connector{ width:16px; height:3px; background:var(--border-strong); flex:0 0 auto; }
  .block-chain-empty{ color:var(--ink-faint); font-size:12.5px; padding:0 6px; }
  .chain-block{
    position:relative; display:flex; align-items:center; gap:6px; padding:8px 10px 8px 16px;
    border-radius:2px 8px 8px 2px; font-size:12.5px; font-weight:700; color:#fff;
    box-shadow:0 2px 0 rgba(0,0,0,.18); cursor:grab;
  }
  .chain-block::before{
    content:""; position:absolute; left:-6px; top:50%; transform:translateY(-50%);
    width:12px; height:14px; background:var(--surface-2); border-radius:4px 0 0 4px;
  }
  .chain-block .order-num{ font-family:var(--font-mono); font-size:10px; opacity:.75; }
  .chain-block button{ background:rgba(0,0,0,.2); border:none; color:#fff; border-radius:4px; padding:2px; display:flex; cursor:pointer; }
  .chain-block button:hover{ background:rgba(0,0,0,.4); }
  .chain-block button svg{ width:11px; height:11px; }
  .chain-block button:disabled{ opacity:.35; cursor:default; }
  .diff-old{ text-decoration:line-through; color:var(--danger); opacity:.75; }
  .diff-new{ color:var(--success); font-weight:700; }
  code.k{ background:var(--surface-2); padding:1px 5px; border-radius:4px; font-family:var(--font-mono); font-size:11.5px; }
  ::placeholder{ color:var(--ink-faint); }
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">生管</div>
      <div class="brand-text"><b>流程管理台</b><span>PROCESS TRACE</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">資料儲存於伺服器，同一網段所有裝置共用、即時同步。</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">總覽</h1>
        <p id="view-sub">工單、站別與過站狀態一覽</p>
      </div>
      <div id="topbar-actions"></div>
    </header>

    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-master" hidden></section>
    <section class="view" id="view-stations" hidden></section>
    <section class="view" id="view-transit" hidden></section>
    <section class="view" id="view-ai" hidden></section>
    <section class="view" id="view-exceptions" hidden></section>
    <section class="view" id="view-stats" hidden></section>
    <section class="view" id="view-history" hidden></section>
  </main>
</div>

<script>
"use strict";

/* ============================= ICONS ============================= */
const ICONS = {
  dashboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M5 8.4V13a4 4 0 0 0 4 4h6"/></svg>',
  transit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h13"/><path d="M12 6l7 6-7 6"/></svg>',

/* ============================= BUSINESS LOGIC (PFMLogic) =============================
   Pure functions — no DOM, no global `state` — unit-tested in pfm-logic.test.js
   via Node's test runner (`node --test`). Each takes an explicit `ctx`
   ({ products, workOrders, stations, exceptionTypes, records }); the app wires
   these against the live `state` via thin wrappers further down. Keep this
   block byte-for-byte in sync with the standalone pfm-logic.js used by the
   test suite — it is the same source, inlined so the artifact stays a single
   self-contained file. */
const ABNORMAL_KEYWORDS = ["不良", "異常", "NG", "ng", "故障", "報廢", "退回", "不合格", "瑕疵"];

const FIELD_LABELS = {
  product: ["產品名稱", "產品"], workOrder: ["工單號碼", "工單"], operator: ["操作人員", "人員", "作業人員"],
  station: ["目前站別", "發生站別", "站別"], qty: ["本次完成數量", "異常數量", "完成數量", "數量"],
  result: ["結果"], problemType: ["問題類型"], followUp: ["後續處理", "後續站別", "後續"],
  reason: ["原因", "跳站原因"], date: ["日期"], time: ["時間"],
};

const PFMLogic = (function(){
  function productById(ctx, id) { return ctx.products.find(p => p.id === id); }
  function productByName(ctx, name) { return ctx.products.find(p => p.name === name); }
  function woById(ctx, id) { return ctx.workOrders.find(w => w.id === id); }
  function woByNo(ctx, no) { return ctx.workOrders.find(w => w.no === no); }
  function stationById(ctx, id) { return ctx.stations.find(s => s.id === id); }
  function stationByName(ctx, name) { return ctx.stations.find(s => s.name === name); }
  function exTypeByName(ctx, name) { return ctx.exceptionTypes.find(e => e.type === name); }
  function processById(ctx, id) { return (ctx.processes || []).find(p => p.id === id); }
  function processByName(ctx, name) { return (ctx.processes || []).find(p => p.name === name); }

  // The ordered station-name sequence a given process defines. Unknown/missing
  // process (not yet assigned, or deleted out from under a product) yields an
  // empty sequence — callers treat that as "nothing to do yet", not a crash.
  function stationSeq(ctx, processId) {
    const proc = processById(ctx, processId);
    if (!proc) return [];
    return proc.stationIds.map(id => (stationById(ctx, id) || {}).name).filter(Boolean);
  }

  // Resolves the process a work order actually runs through, via its product.
  function processForWO(ctx, wo) {
    if (!wo) return null;
    const product = productById(ctx, wo.productId);
    return product ? processById(ctx, product.processId) : null;
  }

  function activeRecordsFor(ctx, woId) {
    return ctx.records.filter(r => r.workOrderId === woId && !r.superseded).sort((a, b) => a.createdAt - b.createdAt);
  }

  /* Replay a work order's records against its product's process sequence to
     derive per-station queue levels, completed qty and current position. */
  function replay(ctx, woId) {
    const wo = woById(ctx, woId);
    const proc = processForWO(ctx, wo);
    const seq = stationSeq(ctx, proc ? proc.id : null);
    const arrived = {}, departed = {};
    if (seq.length) arrived[seq[0]] = wo ? wo.plannedQty : 0;
    let completed = 0;
    const pendingExceptions = [];
    const log = activeRecordsFor(ctx, woId);
    log.forEach(r => {
      if (r.type === "normal") {
        departed[r.station] = (departed[r.station] || 0) + r.qty;
        const idx = seq.indexOf(r.station);
        if (idx >= 0 && idx === seq.length - 1) { completed += r.qty; }
        else if (idx >= 0) { const nxt = seq[idx + 1]; arrived[nxt] = (arrived[nxt] || 0) + r.qty; }
      } else if (r.type === "skip") {
        // Nothing has "arrived" at the skip-to station through the normal
        // sequence, so the qty is drawn from wherever the batch currently
        // sits (earliest active queue first), then behaves like a normal
        // pass from the skip-to station onward.
        let remaining = r.qty;
        for (const name of seq) {
          if (remaining <= 0) break;
          const here = Math.max((arrived[name] || 0) - (departed[name] || 0), 0);
          if (here <= 0) continue;
          const take = Math.min(here, remaining);
          departed[name] = (departed[name] || 0) + take;
          remaining -= take;
        }
        const idx = seq.indexOf(r.station);
        if (idx >= 0 && idx === seq.length - 1) { completed += r.qty; }
        else if (idx >= 0) { const nxt = seq[idx + 1]; arrived[nxt] = (arrived[nxt] || 0) + r.qty; }
      } else if (r.type === "exception") {
        departed[r.station] = (departed[r.station] || 0) + r.qty;
        arrived[r.targetStation] = (arrived[r.targetStation] || 0) + r.qty;
        pendingExceptions.push(r);
      }
    });
    const queues = seq.map(name => ({ name, qty: Math.max((arrived[name] || 0) - (departed[name] || 0), 0) }))
      .filter(q => q.qty > 0);
    return { seq, process: proc || null, arrived, departed, completed, queues, pendingExceptions, log };
  }

  function available(ctx, woId, station) {
    const r = replay(ctx, woId);
    return Math.max((r.arrived[station] || 0) - (r.departed[station] || 0), 0);
  }

  // Total qty still "in process" somewhere in the work order's queues. Used to
  // bound a skip's quantity, since a skip-to station has no "arrived" qty of
  // its own to check against — the batch is drawn from wherever it sits.
  function totalInProcess(ctx, woId) {
    return replay(ctx, woId).queues.reduce((sum, q) => sum + q.qty, 0);
  }

  function woProgress(ctx, woId) {
    const wo = woById(ctx, woId);
    const r = replay(ctx, woId);
    const pct = wo && wo.plannedQty ? Math.min(100, Math.round((r.completed / wo.plannedQty) * 100)) : 0;
    let currentLabel;
    if (!r.process) currentLabel = "尚未指定製程";
    else if (r.completed >= (wo ? wo.plannedQty : 0) && wo && wo.plannedQty > 0) currentLabel = "已完工";
    else if (r.queues.length) currentLabel = r.queues.map(q => q.name).join(" / ");
    else currentLabel = r.seq[0] || "尚未設站";
    return { ...r, pct, currentLabel };
  }

  function parseFreeText(text) {
    const fields = {};
    const lines = text.split(/\r?\n/);
    lines.forEach(line => {
      const m = line.match(/^\s*[◆\-\*•]?\s*([^:：]{1,12})[:：]\s*(.+?)\s*$/);
      if (!m) return;
      const rawLabel = m[1].trim(); const value = m[2].trim();
      for (const key in FIELD_LABELS) {
        if (FIELD_LABELS[key].some(lbl => rawLabel === lbl || rawLabel.endsWith(lbl))) {
          fields[key] = value; break;
        }
      }
    });
    return fields;
  }

  function runDiagnostics(ctx, fields) {
    const diags = [];
    const add = (status, title, msg) => diags.push({ status, title, msg });

    let product = null;
    if (!fields.product) add("fail", "缺少「產品名稱」欄位", "請填寫產品名稱，需先於「產品 / 工單」建立資料才能登記過站。");
    else {
      product = productByName(ctx, fields.product);
      if (!product) add("fail", `查無產品「${fields.product}」`, "此產品尚未建立，請先至「產品 / 工單」新增，或確認名稱是否輸入正確。");
      else add("pass", "產品存在", "已於系統中找到對應產品資料。");
    }

    let wo = null;
    if (!fields.workOrder) add("fail", "缺少「工單號碼」欄位", "每次過站都必須指定工單，請補上工單號碼。");
    else {
      wo = woByNo(ctx, fields.workOrder);
      if (!wo) add("fail", `查無工單「${fields.workOrder}」`, "請確認工單號碼是否輸入正確，或先建立此工單。");
      else if (product && wo.productId !== product.id) add("fail", "工單與產品不相符", `工單「${wo.no}」對應的產品是「${(productById(ctx, wo.productId) || {}).name}」，與輸入的產品「${fields.product}」不一致，請確認是否選錯工單或產品。`);
      else add("pass", "工單存在且與產品相符", "已核對工單資料。");
    }

    let proc = null;
    if (wo) {
      proc = processForWO(ctx, wo);
      if (!proc) add("fail", "此工單的產品尚未指定製程", "請先至「站別設定」建立製程流程，並在「產品 / 工單」為此產品指定所屬製程，才能核對站別順序與數量。");
    }

    let station = null;
    let stationIsSkip = false;
    if (!fields.station) add("fail", "缺少「站別」欄位", "請填寫目前 / 發生站別。");
    else {
      station = stationByName(ctx, fields.station);
      if (!station) add("fail", `站別「${fields.station}」尚未設定`, "請先至「站別設定」建立此站別積木，或確認名稱與已設定站別是否一致（含全形/半形差異）。");
      else if (wo && proc) {
        const prog = woProgress(ctx, wo.id);
        const expected = prog.queues.length ? prog.queues.map(q => q.name) : (prog.seq[0] ? [prog.seq[0]] : []);
        const isExpected = expected.includes(fields.station);
        const isExceptionReceive = prog.pendingExceptions.some(e => e.targetStation === fields.station);
        if (isExpected || isExceptionReceive) { add("pass", "站別符合製程順序", `工單目前應於「${expected.join("、")}」過站，輸入站別相符。`); }
        else {
          if (fields.reason) { stationIsSkip = true; add("warn", "偵測到跳站，已附原因", `目前應於「${expected.join("、")}」過站，但填寫至「${fields.station}」；已記錄跳站原因：「${fields.reason}」。`); }
          else add("fail", "跳過必要站別但未填寫原因", `工單目前應於「${expected.join("、")}」過站，直接填入「${fields.station}」視為跳站，請補上原因欄位，或修正為正確站別。`);
        }
      } else if (wo && !proc) {
        // Already reported above as "尚未指定製程" — avoid a second, redundant complaint.
      } else add("warn", "無法核對站別順序", "缺少有效工單，暫無法比對製程順序。");
    }

    const resultAbnormal = ABNORMAL_KEYWORDS.some(k => (fields.result || "").includes(k));
    const looksAbnormal = !!(fields.problemType || resultAbnormal);
    // The example format often states the problem type only inside "結果"
    // (e.g. 結果：Block 不良) without a separate 問題類型 line — fall back to it.
    let effectiveProblemType = fields.problemType || "";
    if (!effectiveProblemType && resultAbnormal) effectiveProblemType = fields.result;
    if (looksAbnormal) {
      if (!effectiveProblemType) add("fail", "偵測到異常結果但缺少「問題類型」", "結果顯示為異常，請填寫問題類型（或直接於「結果」欄位寫明問題類型）以利分流。");
      else {
        const ex = exTypeByName(ctx, effectiveProblemType);
        if (!ex) add("fail", `問題類型「${effectiveProblemType}」尚未設定分支`, "請先至「站別設定」建立此問題類型對應的後續處理站別，或確認名稱是否與已設定的問題類型一致。");
        else {
          const followUp = fields.followUp || ex.targetStationName;
          const matches = followUp === ex.targetStationName || followUp.includes(ex.targetStationName) || ex.targetStationName.includes(followUp);
          if (!matches) add("warn", "後續站別與設定不符", `問題類型「${effectiveProblemType}」預設應轉入「${ex.targetStationName}」，輸入為「${followUp}」，請確認是否手動調整。`);
          else add("pass", "異常分支設定正確", `問題類型「${effectiveProblemType}」將轉入「${ex.targetStationName}」。`);
        }
      }
    }

    const effectiveType = looksAbnormal ? "exception" : (stationIsSkip ? "skip" : "normal");

    const qtyNum = parseInt(fields.qty, 10);
    if (!fields.qty || isNaN(qtyNum) || qtyNum <= 0) add("fail", "數量錯誤", "數量必須是大於 0 的整數，請確認是否誤填文字、單位或負數。");
    else if (wo && station && proc) {
      // A skip-to station has no "arrived" qty of its own to check against —
      // the batch is drawn from wherever it currently sits — so bound it by
      // the work order's total in-process qty instead of that station's queue.
      const avail = stationIsSkip ? totalInProcess(ctx, wo.id) : available(ctx, wo.id, station.name);
      const availLabel = stationIsSkip ? "工單目前總在製數量" : `「${station.name}」目前可用數量`;
      if (qtyNum > avail) add("fail", "數量超過可過站數量", `${availLabel}為 ${avail} 件，輸入的 ${qtyNum} 件超過上限，請確認是否重複登記或數量填錯。`);
      else add("pass", "數量在可過站範圍內", `${availLabel} ${avail} 件，本次登記 ${qtyNum} 件。`);
    } else add("warn", "數量格式正確，但無法核對上限", "缺少有效工單、站別或製程，暫無法比對可過站數量。");

    if (!fields.date && !fields.time) add("warn", "未填寫日期／時間", "將自動帶入系統目前時間戳記。");
    else add("pass", "日期／時間已提供", "將以輸入內容記錄，仍會保留系統實際送出時間供追查。");

    if (wo) {
      const prog = woProgress(ctx, wo.id);
      if (prog.currentLabel === "已完工") add("fail", "此工單已完工", "已完工工單不得再登記過站，如需更正請至「修正紀錄」。");
    }

    return { diags, product, wo, station, qtyNum, looksAbnormal, effectiveProblemType, effectiveType };
  }

  return {
    ABNORMAL_KEYWORDS, FIELD_LABELS,
    productById, productByName, woById, woByNo, stationById, stationByName, exTypeByName,
    processById, processByName, stationSeq, processForWO,
    activeRecordsFor, replay, available, totalInProcess, woProgress, parseFreeText, runDiagnostics,
  };
})();

/* ============================= STATE (server-backed) =============================
   Data now lives on a shared backend (server.js) so every device sees the same
   工單/站別/紀錄 — this is a multi-user deployment, not per-browser localStorage.
   `state` is a local cache of the server's data: refreshed after every write
   and polled periodically so other people's changes show up here too. */
const uid = (p) => p + "_" + Math.random().toString(36).slice(2,9);
let state = { products: [], workOrders: [], stations: [], processes: [], exceptionTypes: [], records: [] };

async function api(path, method, body){
  const resp = await fetch(path, {
    method: method || "GET",
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try{ data = await resp.json(); }catch(e){ /* no body */ }
  if (!resp.ok) throw new Error((data && data.error) || `伺服器錯誤（${resp.status}）`);
  return data;
}

async function refreshState(){
  state = await api("/api/state");
}

function isTypingInForm(){
  const a = document.activeElement;
  return a && ["INPUT","TEXTAREA","SELECT"].includes(a.tagName);
}

async function withServerSync(action){
  try{
    await action();
    await refreshState();
    render();
    return true;
  }catch(err){
    alert(err.message || "操作失敗，請稍後再試");
    return false;
  }
}

/* ============================= HELPERS ============================= */
function fmtDate(ts){ const d = new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtTime(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDateTime(ts){ return fmtDate(ts)+" "+fmtTime(ts); }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const BLOCK_COLORS = ["#4C97FF","#9966FF","#FF6680","#0FBF9F","#FF9F1C","#59C059","#FF6B57","#6B7FD7"];
function blockColor(id){
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return BLOCK_COLORS[h % BLOCK_COLORS.length];
}

/* Business logic (station replay, quantity limits, AI diagnostics) lives in
   PFMLogic — a pure module unit-tested by pfm-logic.test.js — and is wired
   here against the live `state`. See pfm-logic.js for the tested source. */
function productById(id){ return PFMLogic.productById(state, id); }
function productByName(name){ return PFMLogic.productByName(state, name); }
function woById(id){ return PFMLogic.woById(state, id); }
function woByNo(no){ return PFMLogic.woByNo(state, no); }
function stationById(id){ return PFMLogic.stationById(state, id); }
function stationByName(name){ return PFMLogic.stationByName(state, name); }
function exTypeByName(name){ return PFMLogic.exTypeByName(state, name); }
function processById(id){ return PFMLogic.processById(state, id); }
function processByName(name){ return PFMLogic.processByName(state, name); }
function stationSeq(processId){ return PFMLogic.stationSeq(state, processId); }
function processForWO(wo){ return PFMLogic.processForWO(state, wo); }
function activeRecordsFor(woId){ return PFMLogic.activeRecordsFor(state, woId); }
function replay(woId){ return PFMLogic.replay(state, woId); }
function available(woId, station){ return PFMLogic.available(state, woId, station); }
function totalInProcess(woId){ return PFMLogic.totalInProcess(state, woId); }
function woProgress(woId){ return PFMLogic.woProgress(state, woId); }

/* ============================= NAV ============================= */
const NAV = [
  { id:"dashboard", label:"總覽", icon:"dashboard", title:"總覽", sub:"工單、站別與過站狀態一覽" },
  { id:"master", label:"產品 / 工單", icon:"box", title:"產品與工單", sub:"建立產品資料與生產工單" },
  { id:"stations", label:"站別設定", icon:"route", title:"站別設定", sub:"設定製程順序與異常處理分支" },
  { id:"transit", label:"過站登記", icon:"transit", title:"過站登記", sub:"記錄人員、產品、數量與站別" },
  { id:"ai", label:"AI 助理", icon:"spark", title:"AI 助理", sub:"詢問目前生產狀況，AI 會依系統即時資料回答（唯讀，不會建立或修改紀錄）" },
  { id:"exceptions", label:"異常追蹤", icon:"alert", title:"異常追蹤", sub:"問題類型與後續站別接收狀態" },
  { id:"stats", label:"統計報表", icon:"chart", title:"統計報表", sub:"依產品、工單、站別統計數量" },
  { id:"history", label:"修正紀錄", icon:"history", title:"修正紀錄", sub:"追查輸入錯誤與異動前後對照" },
];
let currentView = "dashboard";

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(n => {
    let count = "";
    if (n.id==="exceptions"){ const c = state.records.filter(r=>r.type==="exception" && !r.superseded && !r.received).length; if (c) count = c; }
    if (n.id==="master"){ count = state.workOrders.length; }
    return `<button class="nav-item ${currentView===n.id?"active":""}" data-nav="${n.id}">${icon(n.icon)}<span>${n.label}</span>${count!==""?`<span class="count">${count}</span>`:""}</button>`;
  }).join("");
  nav.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => { currentView = b.dataset.nav; render(); }));
}

/* ============================= RENDER ROOT ============================= */
function render(){
  renderNav();
  const meta = NAV.find(n=>n.id===currentView);
  document.getElementById("view-title").textContent = meta.title;
  document.getElementById("view-sub").textContent = meta.sub;
  NAV.forEach(n => { document.getElementById("view-"+n.id).hidden = (n.id !== currentView); });
  ({
    dashboard: renderDashboard, master: renderMaster, stations: renderStations,
    transit: renderTransit, ai: renderAI, exceptions: renderExceptions,
    stats: renderStats, history: renderHistory,
  })[currentView]();
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const el = document.getElementById("view-dashboard");
  const totalWO = state.workOrders.length;
  const inProgress = state.workOrders.filter(w => woProgress(w.id).currentLabel !== "已完工").length;
  const done = totalWO - inProgress;
  const pendingEx = state.records.filter(r=>r.type==="exception" && !r.superseded && !r.received).length;

  el.innerHTML = `
    <div class="grid cols-4">
      <div class="card kpi accent"><div class="kpi-num num">${totalWO}</div><div class="kpi-label">生產工單總數</div></div>
      <div class="card kpi warn"><div class="kpi-num num">${inProgress}</div><div class="kpi-label">生產中</div></div>
      <div class="card kpi ok"><div class="kpi-num num">${done}</div><div class="kpi-label">已完工</div></div>
      <div class="card kpi danger"><div class="kpi-num num">${pendingEx}</div><div class="kpi-label">異常待接收</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>工單生產進度</h2><span class="hint">每張工單目前所在站別與完成比例</span></div>
      <div class="card-pad stack" id="dash-travelers"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>最近操作紀錄</h2><span class="hint">依時間倒序，最新 12 筆</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>時間</th><th>工單</th><th>產品</th><th>站別</th><th>類型</th><th>數量</th><th>操作人員</th></tr></thead>
          <tbody id="dash-recent"></tbody>
        </table>
      </div>
    </div>
  `;

  const travWrap = document.getElementById("dash-travelers");
  if (!state.workOrders.length){
    travWrap.innerHTML = `<div class="empty-row muted">尚未建立任何工單，請先至「產品 / 工單」建立。</div>`;
  } else {
    travWrap.innerHTML = state.workOrders.map(wo => travelerCard(wo)).join("");
  }

  const recent = state.records.filter(r=>!r.superseded).sort((a,b)=>b.createdAt-a.createdAt).slice(0,12);
  document.getElementById("dash-recent").innerHTML = recent.length ? recent.map(r => {
    const wo = woById(r.workOrderId);
    const typeChip = r.type==="normal" ? `<span class="chip success">正常過站</span>` : r.type==="skip" ? `<span class="chip warning">跳站</span>` : `<span class="chip danger">異常過站</span>`;
    return `<tr><td class="num small">${escapeHtml(r.date)} ${escapeHtml(r.time)}</td><td class="num">${escapeHtml(wo?wo.no:"—")}</td><td>${escapeHtml(r.productName)}</td><td>${escapeHtml(r.station)}</td><td>${typeChip}</td><td class="num">${r.qty}</td><td>${escapeHtml(r.operator)}</td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty-row">尚無過站紀錄</td></tr>`;
}

function travelerCard(wo){
  const prod = productById(wo.productId);
  const prog = woProgress(wo.id);
  const seq = prog.seq;
  const doneAll = prog.currentLabel === "已完工";
  const nodesHtml = seq.map((name, idx) => {
    const q = prog.queues.find(x=>x.name===name);
    const hasException = prog.pendingExceptions.some(e=>e.targetStation===name);
    let cls = "";
    if (doneAll) cls = "done";
    else if (hasException) cls = "exception";
    else if (q) cls = "current";
    else if (prog.completed>0 && idx < seq.length) cls = "";
    const lineDone = doneAll || (q && idx>0);
    return `<div class="pipe-node ${cls}"><div class="pipe-dot"></div><div class="pipe-label">${escapeHtml(name)}</div>${q?`<div class="pipe-qty">${q.qty} 件</div>`:""}</div>` +
           (idx < seq.length-1 ? `<div class="pipe-line ${doneAll?"done":""}"></div>` : "");
  }).join("");
  const statusChip = doneAll ? `<span class="chip success"><span class="dot"></span>已完工</span>` :
    !prog.process ? `<span class="chip warning"><span class="dot"></span>尚未指定製程</span>` :
    prog.pendingExceptions.length ? `<span class="chip danger"><span class="dot"></span>等待${escapeHtml(prog.pendingExceptions[prog.pendingExceptions.length-1].targetStation)}接收</span>` :
    `<span class="chip info"><span class="dot"></span>生產中：${escapeHtml(prog.currentLabel)}</span>`;
  return `
    <div class="card traveler">
      <div class="traveler-top">
        <div>
          <span class="traveler-id">${escapeHtml(wo.no)}</span>
          <span class="traveler-meta">　${escapeHtml(prod?prod.name:"未指定產品")} · 預計 ${wo.plannedQty} 件 · 已完成 ${prog.completed} 件</span>
        </div>
        ${statusChip}
      </div>
      <div class="pipeline">${nodesHtml || `<span class="muted small">${prog.process ? "此製程尚未加入任何站別" : "此產品尚未指定製程，請至「站別設定」設定"}</span>`}</div>
      <div class="progress-bar"><i style="width:${prog.pct}%"></i></div>
    </div>
  `;
}

/* 拖拉邏輯：從積木庫拖站別到某製程的軌道（加入到最後，或插在既有積木之間），
   或是把軌道上已經在排的積木拖到新位置（同一製程內重新排序）。 */
function wireStationDragAndDrop(el){
  let dragPayload = null; // { stationId, fromProcessId | null }

  el.querySelectorAll("[data-drag-station]").forEach(tile => {
    tile.addEventListener("dragstart", (e) => {
      dragPayload = { stationId: tile.dataset.dragStation, fromProcessId: null };
      tile.classList.add("dragging");
      e.dataTransfer.effectAllowed = "copy";
    });
    tile.addEventListener("dragend", () => tile.classList.remove("dragging"));
  });
  el.querySelectorAll("[data-drag-chain]").forEach(block => {
    block.addEventListener("dragstart", (e) => {
      dragPayload = { stationId: block.dataset.dragChain, fromProcessId: block.dataset.proc };
      block.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    block.addEventListener("dragend", () => block.classList.remove("dragging"));
  });

  el.querySelectorAll("[data-dropzone]").forEach(zone => {
    const procId = zone.dataset.dropzone;
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("dropzone-active"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("dropzone-active"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dropzone-active");
      if (!dragPayload) return;
      const { stationId, fromProcessId } = dragPayload;
      dragPayload = null;

      // 決定插入位置：滑鼠落點左邊已經有幾個積木。
      const chainBlocks = [...zone.querySelectorAll("[data-drag-chain]")].filter(b => b.dataset.dragChain !== stationId || fromProcessId !== procId);
      let insertBeforeId = null;
      for (const b of chainBlocks) {
        const rect = b.getBoundingClientRect();
        if (e.clientX < rect.left + rect.width/2) { insertBeforeId = b.dataset.dragChain; break; }
      }

      if (fromProcessId === procId) {
        // 同一條軌道內重新排序
        const proc = processById(procId);
        const ids = proc.stationIds.filter(id => id !== stationId);
        const insertAt = insertBeforeId ? ids.indexOf(insertBeforeId) : ids.length;
        ids.splice(insertAt < 0 ? ids.length : insertAt, 0, stationId);
        withServerSync(() => api(`/api/processes/${procId}/stations/reorder`, "POST", { stationIds: ids }));
      } else if (!fromProcessId) {
        // 從積木庫拖進來：先加入，如果沒有落在最後面，再排到正確位置
        withServerSync(async () => {
          await api(`/api/processes/${procId}/stations`, "POST", { stationId });
          if (insertBeforeId) {
            const proc = state.processes.find(p => p.id === procId);
            const ids = proc.stationIds.filter(id => id !== stationId);
            const insertAt = ids.indexOf(insertBeforeId);
            ids.splice(insertAt < 0 ? ids.length : insertAt, 0, stationId);
            await api(`/api/processes/${procId}/stations/reorder`, "POST", { stationIds: ids });
          }
        });
      } else {
        // 從另一個製程的軌道拖過來：從原製程移除，加入這個製程
        withServerSync(async () => {
          await api(`/api/processes/${fromProcessId}/stations/${stationId}`, "DELETE");
          await api(`/api/processes/${procId}/stations`, "POST", { stationId });
        });
      }
    });
  });
}

  const now = new Date();

      const sel = document.getElementById("t-problem");

      if (sel){ sel.addEventListener("change", syncTarget); syncTarget(); }
    } else {

  el.querySelectorAll('input[name=ttype]').forEach(r => r.addEventListener("change", () => {
    el.querySelectorAll(".radio-chip").forEach(c=>c.classList.toggle("checked", c.querySelector("input").checked));

  function refreshAvail(){
    const woId = document.getElementById("t-wo").value;
    const box = document.getElementById("t-station-avail");
    if (!woId){ box.innerHTML = `<span class="muted small">請先選擇工單</span>`; return; }

      return;

          const qty = (prog.arrived[name]||0) - (prog.departed[name]||0);
          return `<div class="stat-bar-row"><div class="name">${escapeHtml(name)}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100, (Math.max(qty,0)/ (woById(woId).plannedQty||1))*100)}%"></div></div><div class="stat-bar-num num">${Math.max(qty,0)}</div></div>`;

  if (woSel) woSel.addEventListener("change", refreshAvail);
  refreshAvail();

  const btn = document.getElementById("btn-submit-transit");
  if (btn) btn.addEventListener("click", () => submitTransit());
}

async function submitTransit(){
  const woId = document.getElementById("t-wo").value;
  const operator = document.getElementById("t-operator").value.trim();
  const station = document.getElementById("t-station").value;
  const qty = parseInt(document.getElementById("t-qty").value, 10);
  const type = document.querySelector('input[name=ttype]:checked').value;
  const date = document.getElementById("t-date").value;
  const time = document.getElementById("t-time").value;
  const resultBox = document.getElementById("t-result");

  const errors = [];
  if (!woId) errors.push("請選擇工單");
  if (!operator) errors.push("請填寫操作人員");
  if (!station) errors.push("請選擇站別");
  if (!qty || qty <= 0) errors.push("數量須為正整數");

  const wo = woById(woId);
  const prog = wo ? woProgress(woId) : null;
  const seq = prog ? prog.seq : [];
  let reason = "", problemType = "", targetStation = "";

  if (wo && !prog.process) errors.push("此工單的產品尚未指定製程，請先至「站別設定」建立製程並在「產品/工單」指定");

  if (type === "skip"){
    reason = (document.getElementById("t-reason")?.value || "").trim();
    if (!reason) errors.push("跳站需填寫原因");
  }

  if (wo && qty > 0){
    // A skip-to station has no "arrived" qty of its own to check against —
    // the batch is drawn from wherever it currently sits — so bound it by
    // the work order's total in-process qty instead of that station's queue.
    if (type === "skip"){
      const avail = totalInProcess(woId);
      if (qty > avail) errors.push(`數量超過工單目前總在製數量（目前在製 ${avail} 件）`);
    } else {
      const avail = available(woId, station);
      if (qty > avail) errors.push(`數量超過「${station}」可過站數量（目前可用 ${avail} 件）`);
    }
  }
  if (type === "exception"){
    problemType = document.getElementById("t-problem")?.value || "";
    targetStation = document.getElementById("t-target")?.value || "";
    if (!problemType) errors.push("請選擇問題類型");
    if (!targetStation) errors.push("問題類型尚未對應後續站別，請至站別設定新增");
  }
  if (type === "normal" && wo){
    const idx = seq.indexOf(station);
    const expected = prog.queues.length ? prog.queues[0].name : seq[0];
    if (idx>=0 && expected && station !== expected && !(prog.pendingExceptions.some(e=>e.targetStation===station))){
      errors.push(`目前應於「${expected}」過站，若確定要跳至「${station}」請改選「跳站」並填寫原因`);
    }
  }

  if (errors.length){
    resultBox.innerHTML = `<div class="diag-row fail"><div class="diag-icon">${icon("cross")}</div><div><div class="diag-title">送出前核對未通過</div><div class="diag-msg">${errors.map(escapeHtml).join("；")}</div></div></div>`;
    return;
  }

  // Client-side checks above give fast feedback; the server re-validates
  // against its own current state (source of truth) before writing — this
  // is what actually protects against two people submitting at once.
  let rec;
  try{
    rec = await api("/api/records", "POST", {
      workOrderId: woId, operator, station, qty, type, reason, problemType, targetStation,
      date: date || fmtDate(Date.now()), time: time || fmtTime(Date.now()),
    });
  }catch(err){
    // No state change happened — safe to write straight into the box we
    // already have a live reference to, without re-rendering the view.
    resultBox.innerHTML = `<div class="diag-row fail"><div class="diag-icon">${icon("cross")}</div><div><div class="diag-title">送出前核對未通過</div><div class="diag-msg">${escapeHtml(err.message)}</div></div></div>`;
    return;
  }

  // A record was written — refresh and re-render so the "各站可用數量" panel
  // reflects the new totals, then re-query #t-result: render() just rebuilt
  // the whole view, so the `resultBox` reference from above is now detached.
  await refreshState();
  render();
  document.getElementById("t-result").innerHTML = ticketHtml(rec, wo);
}

function ticketHtml(rec, wo){
  const rows = [
    ["登記結果", rec.type==="normal"?"正常過站":rec.type==="skip"?"跳站過站":"異常過站"],
    ["產品", rec.productName], ["工單", wo.no], ["操作人員", rec.operator], ["發生站別", rec.station],
  ];
  if (rec.type==="skip") rows.push(["跳站原因", rec.reason]);
  if (rec.type==="exception"){ rows.push(["問題類型", rec.problemType], ["異常數量", rec.qty+" 件"], ["後續站別", rec.targetStation]); }
  else { rows.push(["數量", rec.qty+" 件"]); }
  rows.push(["狀態", rec.type==="exception" ? `等待${rec.targetStation}接收` : "已登記"]);
  return `<div class="ticket">${rows.map(([k,v])=>`<div class="t-row"><span class="t-key">${escapeHtml(k)}</span><span class="t-val">${escapeHtml(v)}</span></div>`).join("")}
    <div class="t-row"><span class="t-key">系統紀錄</span><span class="t-val">${escapeHtml(rec.date)} ${escapeHtml(rec.time)} 已保留原始資料</span></div></div>`;
}

/* ============================= AI 助理（對話介面） =============================
   唯讀查詢助理：回答「現在鍍膜有排工單嗎」這類問題，資料來自即時 state。
   不會建立或修改任何紀錄——過站登記/修正一律走各自頁面的表單與驗證。 */
function getAiSessionId(){
  let id = localStorage.getItem("pfmAiSessionId");
  if (!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : "s_" + Date.now() + Math.random().toString(16).slice(2));
    localStorage.setItem("pfmAiSessionId", id);
  }
  return id;
}
const aiSessionId = getAiSessionId();
const AI_MAX_LENGTH = 2000;
let aiChatLog = []; // 只是畫面顯示用，重整頁面會清空；AI 真正的記憶在伺服器端依 sessionId 保存

function renderAI(){
  const el = document.getElementById("view-ai");
  el.innerHTML = `
    <div class="card" style="height:calc(100vh - 180px); display:flex; flex-direction:column;">
      <div class="card-head"><h2>詢問目前生產狀況</h2><span class="hint">唯讀查詢，不會建立或修改任何紀錄</span></div>
      <div id="ai-chat-log" class="stack" style="flex:1; overflow-y:auto; padding:18px 20px;"></div>
      <div style="border-top:1px solid var(--border); padding:14px 18px; display:flex; flex-direction:column; gap:8px;">
        <div class="form-row" style="align-items:flex-end;">
          <div class="field" style="flex:1;">
            <textarea id="ai-chat-input" rows="2" placeholder="例如：鍍膜今天有排工單嗎？80CS 做到哪一站了？（Enter 送出，Shift+Enter 換行）" style="font-family:inherit;"></textarea>
          </div>
          <button class="btn accent" id="btn-ai-send" style="flex:0 0 auto;">${icon("spark")}送出</button>
        </div>
        <div class="small muted" id="ai-char-counter">0 / ${AI_MAX_LENGTH} 字</div>
      </div>
    </div>
  `;

  const log = document.getElementById("ai-chat-log");
  const input = document.getElementById("ai-chat-input");
  const counter = document.getElementById("ai-char-counter");

  function renderLog(){
    log.innerHTML = aiChatLog.length ? aiChatLog.map(m => {
      const cssClass = m.kind === "user" ? "pass" : m.kind === "error" ? "fail" : "info";
      const extraStyle = m.kind === "user" ? "margin-left:auto; background:var(--accent-soft);" : "";
      return `
      <div class="diag-row ${cssClass}" style="max-width:80%; ${extraStyle}">
        <div class="diag-icon">${icon(m.kind==="user" ? "transit" : m.kind==="error" ? "cross" : "spark")}</div>
        <div class="diag-msg" style="white-space:pre-wrap; color:var(--ink);">${escapeHtml(m.text)}</div>
      </div>`;
    }).join("") : `<span class="muted small">試著問問看：「鍍膜今天有要做事嗎？」「80CS 現在在哪一站？」「有沒有異常還沒處理？」</span>`;
    log.scrollTop = log.scrollHeight;
  }
  renderLog();

  function updateCounter(){
    const len = input.value.length;
    counter.textContent = `${len} / ${AI_MAX_LENGTH} 字`;
    counter.classList.toggle("over", len > AI_MAX_LENGTH);
  }
  input.addEventListener("input", updateCounter);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendAiChat(); }
  });
  document.getElementById("btn-ai-send").addEventListener("click", sendAiChat);

  async function sendAiChat(){
    const text = input.value.trim();
    if (!text) return;
    if (text.length > AI_MAX_LENGTH){
      aiChatLog.push({ kind: "error", text: `訊息過長，單次最多 ${AI_MAX_LENGTH} 字（目前 ${text.length} 字）。` });
      renderLog();
      return;
    }
    aiChatLog.push({ kind: "user", text });
    input.value = "";
    updateCounter();
    renderLog();
    document.getElementById("btn-ai-send").disabled = true;
    try{
      const { reply } = await api("/api/assistant/chat", "POST", { message: text, sessionId: aiSessionId });
      aiChatLog.push({ kind: "ai", text: reply });
    }catch(err){
      aiChatLog.push({ kind: "error", text: err.message });
    }finally{
      document.getElementById("btn-ai-send").disabled = false;
      renderLog();
      input.focus();
    }
  }
}

/* ============================= STATS ============================= */
function renderStats(){
  const el = document.getElementById("view-stats");
  const byProduct = state.products.map(p => {
    const wos = state.workOrders.filter(w=>w.productId===p.id);
    const qty = wos.reduce((s,w)=>s + woProgress(w.id).completed, 0);
    return { name: p.name, qty, wos: wos.length };
  });
  const byWO = state.workOrders.map(w => ({ name: w.no, qty: woProgress(w.id).completed, planned: w.plannedQty }));
  const byStation = state.stations.map(s => {
    const qty = state.records.filter(r=>!r.superseded && r.station===s.name).reduce((sum,r)=>sum+r.qty,0);
    const exQty = state.records.filter(r=>!r.superseded && r.station===s.name && r.type==="exception").reduce((sum,r)=>sum+r.qty,0);
    return { name: s.name, qty, exQty };
  });
  const maxProduct = Math.max(1, ...byProduct.map(x=>x.qty));
  const maxWO = Math.max(1, ...byWO.map(x=>x.planned));
  const maxStation = Math.max(1, ...byStation.map(x=>x.qty));

  const barBlock = (rows, keyMax, extra) => rows.length ? rows.map(r => `
    <div class="stat-bar-row">
      <div class="name" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100,(r.qty/keyMax)*100)}%"></div></div>
      <div class="stat-bar-num num">${r.qty}${extra?extra(r):""}</div>
    </div>`).join("") : `<div class="empty-row muted">尚無資料</div>`;

  el.innerHTML = `
    <div class="grid cols-3">
      <div class="card">
        <div class="card-head"><h2>依產品統計</h2><span class="hint">已完成數量</span></div>
        <div class="card-pad">${barBlock(byProduct, maxProduct, r=>` / ${r.wos} 張工單`)}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2>依工單統計</h2><span class="hint">完成 / 預計</span></div>
        <div class="card-pad">${barBlock(byWO.map(r=>({name:r.name, qty:r.qty})), maxWO, (r)=>{ const wo=byWO.find(x=>x.name===r.name); return ` / ${wo.planned}`; })}</div>
      </div>
      <div class="card">
        <div class="card-head"><h2>依站別統計</h2><span class="hint">通過總數（含異常）</span></div>
        <div class="card-pad">${barBlock(byStation, maxStation, r=>r.exQty?` (異常 ${r.exQty})`:"")}</div>
      </div>
    </div>
  `;
}

function openCorrectionForm(recId){
  const rec = state.records.find(r=>r.id===recId);
  if (!rec) return;
  document.getElementById("correction-card").hidden = false;
  const body = document.getElementById("correction-body");
  body.innerHTML = `
    <div class="small muted">原始紀錄由 <b>${escapeHtml(rec.operator)}</b> 於 ${fmtDateTime(rec.createdAt)} 建立，原始內容將完整保留於下方對照表。</div>
    <div class="form-row">
      <div class="field"><label>站別</label><select id="c-station">${state.stations.map(s=>`<option ${s.name===rec.station?"selected":""}>${escapeHtml(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label>數量</label><input type="number" id="c-qty" value="${rec.qty}"></div>
      <div class="field"><label>操作人員</label><input type="text" id="c-operator" value="${escapeHtml(rec.operator)}"></div>
    </div>
    <div class="field"><label>更正人員 <span class="req">*</span>（本次執行更正的人）</label><input type="text" id="c-by" placeholder="姓名"></div>
    <div><button class="btn accent" id="btn-save-correction">${icon("check")}儲存更正（保留原始資料）</button> <button class="btn ghost" id="btn-cancel-correction">取消</button></div>
  `;
  document.getElementById("btn-cancel-correction").addEventListener("click", () => { document.getElementById("correction-card").hidden = true; });
  document.getElementById("btn-save-correction").addEventListener("click", () => {
    const correctedBy = document.getElementById("c-by").value.trim();
    if (!correctedBy){ alert("請填寫更正人員"); return; }
    const qty = parseInt(document.getElementById("c-qty").value, 10);
    if (!qty || qty<=0){ alert("數量須為正整數"); return; }
    withServerSync(() => api(`/api/records/${rec.id}/correct`, "POST", {
      station: document.getElementById("c-station").value,
      qty, operator: document.getElementById("c-operator").value.trim(), correctedBy,
    })).then(ok => { if (ok) document.getElementById("correction-card").hidden = true; });
  });
}

/* ============================= INIT ============================= */
async function init(){
  try{
    await refreshState();
  }catch(err){
    document.getElementById("view-title").textContent = "無法連線到伺服器";
    document.getElementById("view-sub").textContent = "請確認 server.js 是否已啟動，以及網址是否正確（" + err.message + "）";
    return;
  }
  render();
  // Poll for other users' changes. Skip the re-render (not the fetch) while
  // someone is mid-typing so a background refresh never yanks their cursor.
  setInterval(async () => {
    try{
      await refreshState();
      if (!isTypingInForm()) render();
    }catch(err){ /* transient network hiccup — try again next tick */ }
  }, 4000);
}
init();
</script>
